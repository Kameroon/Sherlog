  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <!-- Shared with the login page: this path stays reachable by any visitor, unlike the rest of the site. -->
    <link rel="stylesheet" href="/login/base.css" />
    <link rel="stylesheet" href="/login/login.css" />
    <title>Accès refusé — Sherlog</title>
  </head>
  <body>
    <main class="page">
      <div class="card">
        <div class="forbidden-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <rect x="5" y="11" width="14" height="9" rx="2" />
            <path d="M8 11V8a4 4 0 018 0v3" />
          </svg>
        </div>
        <h1>Accès réservé</h1>
        <p class="lead">Ce compte est bien connecté, mais il n’a pas encore été invité à utiliser Sherlog. Demandez une invitation à la personne qui administre l’application.</p>
        <a class="button-primary" href="/.auth/logout?post_logout_redirect_uri=/login/">Se déconnecter</a>
      </div>
    </main>
  </body>
